name: Feature / Engine idea
description: Capture a lightweight idea for an engine/architecture capability. Intake only — a real spec still gets written under docs/features/ per docs/feature-workflow.md before implementation.
labels:
  - feature-engine
body:
  - type: markdown
    attributes:
      value: |
        This is intake only, not a spec. Full existing-capability analysis and design detail happen in a `docs/features/` spec at pickup time.
  - type: input
    id: title
    attributes:
      label: Title
      description: Short, specific name for the idea.
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What's the idea, briefly?
    validations:
      required: true
  - type: textarea
    id: existing-capability
    attributes:
      label: What existing capability might this touch or need?
      description: Rough notes only — commands, schemas, components, patterns. Not the full existing-capability check from the spec template.
    validations:
      required: false
